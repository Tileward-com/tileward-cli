name: sca

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -e ".[dev]"
      # An editable install freezes as a VCS line for the project itself; audit what it depends on.
      - run: pip freeze --exclude-editable > .requirements.txt

      - name: pip-audit
        # --strict: a dependency that cannot be audited fails the job instead of passing unchecked.
        run: pipx run pip-audit -r .requirements.txt --no-deps --disable-pip --strict

      - name: semgrep
        # Findings are reported to code scanning rather than failing the build, and the scan still
        # runs when the dependency audit above fails.
        if: ${{ !cancelled() }}
        run: >-
          pipx run semgrep scan
          --config p/python
          --config r/python.lang.security
          --metrics=off
          --sarif-output=semgrep.sarif

      - name: Upload SARIF results
        # Pull requests from forks and from Dependabot run with a read-only token, which cannot upload.
        if: >-
          ${{
            !cancelled()
            && hashFiles('semgrep.sarif') != ''
            && (github.event_name == 'push'
              || (github.event.pull_request.head.repo.full_name == github.repository
                && github.actor != 'dependabot[bot]'))
          }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: semgrep.sarif
